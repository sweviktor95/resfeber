<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2838">
<meta name="description" content="Resfeber – res jorden runt, jobba, fotografera och bli Världsresenärernas ordförande.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resfeber">
<style>html,body{margin:0;height:100%;overscroll-behavior:none}#fsbtn{font-size:18px}</style>
<title>Resfeber</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-screen phone game. Status strip on top, three tabs (Stad / Karta / Väska) in the middle, tab bar at the bottom. */
:root{
  --ocean:#7fbde3; --grid:#9fcde9; --land:#9bcb6c; --land-edge:#5f8f3e;
  --paper:#fbf8f1; --paper-2:#f2ede1; --ink:#1b2838; --muted:#5b6876; --line:#d9d1bf;
  --accent:#2648c9; --accent-ink:#ffffff; --stamp:#c13a2a; --gold:#c98a12; --good:#1f7a4d; --bad:#b33a2b;
  --board:#16202c; --board-ink:#f6d47a; --board-sub:#aab6c4;
  --park:#c9dcae; --block:#e4d8bd; --street:#fffdf7; --street-edge:#c4b28a;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ocean:#163b5c; --grid:#1d4a70; --land:#3c6b34; --land-edge:#5b8f4c;
  --paper:#151f2b; --paper-2:#1c2836; --ink:#e8edf3; --muted:#9ba8b6; --line:#2c3a4b;
  --accent:#7f9cff; --accent-ink:#0d1520; --stamp:#ff7461; --gold:#f0b440; --good:#57c98d; --bad:#ff7a6b;
  --board:#0a1119; --board-ink:#f6d47a; --board-sub:#8e9bab; --park:#2a3d33; --block:#313e4f; --street:#56657a; --street-edge:#1b2531; color-scheme:dark}}
:root[data-theme="dark"]{
  --ocean:#163b5c; --grid:#1d4a70; --land:#3c6b34; --land-edge:#5b8f4c;
  --paper:#151f2b; --paper-2:#1c2836; --ink:#e8edf3; --muted:#9ba8b6; --line:#2c3a4b;
  --accent:#7f9cff; --accent-ink:#0d1520; --stamp:#ff7461; --gold:#f0b440; --good:#57c98d; --bad:#ff7a6b;
  --board:#0a1119; --board-ink:#f6d47a; --board-sub:#8e9bab; --park:#2a3d33; --block:#313e4f; --street:#56657a; --street-edge:#1b2531; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:1fr;max-width:760px;margin:0 auto;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}

/* status strip */
.top{background:var(--board);color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.clock{display:flex;align-items:center;gap:8px}
.clock svg{width:26px;height:26px;flex:none}
.clock b,.money b{display:block;font-family:var(--f-mono);font-weight:700;font-size:17px;color:var(--board-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.clock span,.money span,.energy span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-sub)}
.energy{min-width:0}
.bar{height:8px;border-radius:99px;background:#ffffff1f;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;background:#5fd394;transition:width .4s,background .4s}
.money{text-align:right}
.flash{animation:flash .7s}
@keyframes flash{30%{transform:scale(1.14);color:#fff}}

main{position:relative;min-height:0}
.panel{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}

/* city tab */
.scene{position:relative;height:clamp(130px,21vh,190px);background:var(--board)}
.walk{position:relative;height:100%;background:var(--ocean);touch-action:none;overflow:hidden;border-bottom:1px solid var(--line)}
#street{display:block;width:100%;height:100%;touch-action:none}
#walk{position:absolute;inset:0;display:block;width:100%;height:100%;user-select:none;background:var(--ocean);z-index:2}
#walk[hidden]{display:none}
.walk .mapctl{z-index:3;top:max(10px,env(safe-area-inset-top,0px))}
#tab-city{overflow:hidden}
.hud{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;z-index:3;background:color-mix(in srgb,var(--board) 88%,transparent);color:#fff;border-radius:12px;padding:7px 10px 8px;box-shadow:0 3px 10px #0003;max-width:calc(100% - 80px);backdrop-filter:blur(4px)}
.hud-row{display:flex;align-items:center;gap:6px;white-space:nowrap}
.hud-row svg{width:30px;height:30px;flex:none}
#h-money{color:#5dff6a!important;text-shadow:0 0 6px #2ad13c88;font-size:16px!important}
.hud .bar i{background:#5dff6a!important}
.hud-row b{font-family:var(--f-mono);font-size:15px;color:var(--board-ink);font-variant-numeric:tabular-nums}
.hud-row span{font-size:11px;color:var(--board-sub)}
.hud-sep{width:1px;height:14px;background:#ffffff33;margin:0 2px}
.hud .bar{height:5px;margin-top:6px}
.hud-city{font-size:12px;margin-top:5px;color:#e8edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-city b{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.hud-city span{color:var(--board-sub)}
#snd svg{width:20px;height:20px}
#snd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.walk .walkhint{z-index:3}
.joy{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:132px;height:132px;border-radius:50%;background:color-mix(in srgb,var(--paper) 72%,transparent);border:1.5px solid var(--line);box-shadow:0 3px 10px #0003;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:var(--muted);z-index:3}
.joy svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--accent);border:3px solid var(--paper);box-shadow:0 2px 8px #0005;pointer-events:none;transition:transform .08s}
.joy.on .knob{transition:none}
.w3fail{position:absolute;inset:auto 16px 16px 16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;z-index:4}
.walk .near{z-index:3;right:166px}
.w-water{fill:var(--ocean)}.w-land{fill:var(--land)}.w-shore{stroke:var(--land-edge);stroke-width:1.2;vector-effect:non-scaling-stroke}
.w-block{fill:var(--block)}.w-park{fill:var(--park)}
.w-street-c,.w-bridge-c,.w-street,.w-bridge,.w-alley{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.w-street-c{stroke:var(--street-edge);stroke-width:8}.w-street{stroke:var(--street);stroke-width:5.5}
.w-bridge-c{stroke:var(--ink);stroke-width:8;opacity:.55}.w-bridge{stroke:var(--street);stroke-width:5}
.w-alley{stroke:var(--street);stroke-width:2.5;opacity:.9}
.w-area{fill:var(--muted);font-family:var(--f-display);font-weight:700;letter-spacing:.14em;opacity:.55;pointer-events:none}
.w-wname{fill:var(--accent);font-style:italic;font-weight:600;opacity:.7;pointer-events:none}
.w-poi circle{fill:var(--accent);stroke:var(--paper);stroke-width:2.5}.w-poi g{stroke:var(--accent-ink)}
.w-sight circle{fill:var(--stamp)}.w-lux circle,.w-hostel circle{fill:var(--gold)}.w-info circle{fill:var(--muted)}
.w-closed{opacity:.55}
.w-lbl{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-linejoin:round;pointer-events:none}
.w-me .w-bob{transform-box:fill-box}
.w-me.walking .w-bob{animation:bob .32s ease-in-out infinite alternate}
.w-me.walking .w-leg1{animation:leg .32s ease-in-out infinite alternate}
.w-me.walking .w-leg2{animation:leg .32s ease-in-out infinite alternate-reverse}
@keyframes bob{to{transform:translateY(-1.6px)}}
@keyframes leg{from{transform:translateY(-1.5px)}to{transform:translateY(0)}}
.w-pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.dpad{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dpad button{border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 6px #0003;touch-action:none;padding:0}
.dpad button svg{width:24px;height:24px}
.dpad button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dpad .act{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:50%}
.dpad .act:disabled{background:color-mix(in srgb,var(--paper) 70%,transparent);color:var(--muted);border-color:var(--line);box-shadow:none}
.near{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:12px;right:184px;background:var(--paper);border:1.5px solid var(--accent);border-radius:12px;padding:9px 10px;display:grid;gap:7px;box-shadow:0 4px 14px #0003;animation:up .2s ease-out}
.near[hidden]{display:none}
.near b{display:block;font-size:14px;line-height:1.2}
.near small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.25}
.near .btn{margin:0;padding:8px 10px;font-size:14px}
.walkctl{top:10px}
.walkhint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:14px;right:160px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--muted);pointer-events:none;box-shadow:0 2px 6px #0002}
.place .mins{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--accent);margin-top:2px}
.scene canvas{display:block;width:100%;height:100%}
.scene-cap{position:absolute;left:0;right:0;bottom:0;padding-block:28px 12px;color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,#0b1220d9,#0b122000)}
.scene-cap h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,7vw,34px);line-height:1;letter-spacing:-.01em;text-shadow:0 2px 10px #0006}
.scene-cap .sub{font-size:13.5px;opacity:.9;margin-top:5px}
.sound{position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:1px solid #ffffff40;background:#0b1220b3;color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.sound svg{width:22px;height:22px}
.bagbtn{right:calc(max(10px,env(safe-area-inset-right,0px)) + 48px)}
.backbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 2px 6px #0002}
#mapback{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;z-index:3}
#tab-map .maphint{top:56px}
.sound[aria-pressed="true"]{background:var(--board-ink);color:var(--board);border-color:var(--board-ink)}
.rankchip{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));background:#0b1220b3;color:#fff;border:1px solid #ffffff33;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(4px)}
.inner{padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.sec-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.places{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 10px;min-width:0}
.place:hover{border-color:var(--accent)}
.place svg{width:34px;height:34px;color:var(--accent)}
.place b{display:block;font-size:14px;line-height:1.2}
.place small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.25}
.place.closed svg{color:var(--muted)}
.letters{display:grid;gap:8px}
.letter{background:var(--paper-2);border:1px solid var(--line);border-radius:4px 12px 12px 4px;padding:11px 12px 11px 14px;position:relative;
  background-image:repeating-linear-gradient(135deg,var(--stamp) 0 6px,transparent 6px 12px,var(--accent) 12px 18px,transparent 18px 24px);
  background-size:4px 100%;background-repeat:no-repeat}
.letter .lt{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.letter p{margin:5px 0 0;line-height:1.45;font-size:14.5px}
.letter .tip{display:inline-block;margin-top:6px;font-size:12.5px;background:var(--paper);border:1px dashed var(--land-edge);border-radius:6px;padding:2px 8px}

/* map tab */
#tab-map{overflow:hidden;background:var(--ocean);touch-action:none}
#map{display:block;width:100%;height:100%;user-select:none}
.ocean{fill:var(--ocean)}
.grat{stroke:var(--grid);stroke-width:.6;fill:none}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:.7;stroke-linejoin:round}
.lake{fill:var(--ocean);stroke:var(--land-edge);stroke-width:.6}
.city{fill:var(--paper);stroke:var(--ink)}
.city.visited{fill:var(--gold)}
.city.here{fill:var(--accent);stroke:var(--paper)}
.city.locked{fill:var(--land-edge);stroke:none;opacity:.6}
.pulse{fill:none;stroke:var(--accent);animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3)}}
.lbl{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-linejoin:round;pointer-events:none}
.route{fill:none;stroke:var(--accent);stroke-linecap:round}
.vehicle{fill:var(--accent);stroke:var(--paper)}
.mapctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
#wov.has{background:#ffd84a}
.cmap{position:fixed;inset:0;z-index:60;background:#f5eedb;touch-action:none}.cmap canvas{position:absolute;inset:0;width:100%;height:100%}
.cmap-top{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));right:64px;background:#1b2838;color:#fbf8f1;border-radius:14px;padding:9px 14px;font:600 13px Figtree,system-ui,sans-serif;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 14px #0003}.cmap-top b{font:800 17px Unbounded,sans-serif}
.cmap-btns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}.cmap-btns button{width:42px;height:42px;border-radius:12px;border:1px solid #0002;background:#fbf8f1;font:800 20px Figtree,system-ui,sans-serif;color:#1b2838;box-shadow:0 2px 6px #0003}
#drinkbtn{position:relative}#drinkbtn[disabled]{opacity:.45}#drinkn{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:#e8742a;color:#fff;font:800 11px/18px Figtree,system-ui,sans-serif;text-align:center;padding:0 4px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:20px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px #0002}
.conts{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.conts::-webkit-scrollbar{display:none}
.conts button{flex:none;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font:700 13px var(--f-body);color:var(--ink);box-shadow:0 2px 6px #0002}.conts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}.conts button.lk{opacity:.6}
.legend{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;right:60px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.legend span{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.maphint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;right:60px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--muted);box-shadow:0 2px 6px #0002}

/* bag tab */
.rankcard{background:var(--board);color:#fff;border-radius:14px;padding:16px}
.rankcard .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--board-sub);font-weight:700}
.rankcard h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin-top:4px;color:var(--board-ink)}
.rankcard .bar{height:10px;margin-top:12px}
.rankcard .bar i{background:var(--board-ink)}
.rankcard small{display:block;margin-top:6px;color:var(--board-sub);font-size:12.5px}
.ladder{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.ladder span{flex:1;text-align:center;font-size:10.5px;padding:4px 2px;border-radius:6px;background:#ffffff14;color:var(--board-sub);font-weight:600}
.ladder span.on{background:var(--board-ink);color:var(--board)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.polaroid{background:#fff;padding:7px 7px 6px;border-radius:2px;box-shadow:0 3px 10px #0003;color:#222;transform:rotate(var(--r,0deg))}
.polaroid canvas{display:block;width:100%;aspect-ratio:4/3;background:#222}
.polaroid .cap{font-family:var(--f-hand);font-size:17px;line-height:1.05;margin-top:5px}
.polaroid .cap small{display:block;font-family:var(--f-body);font-size:10.5px;color:#666}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1.5px solid var(--good);color:var(--good);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700}
.chips span.off{border-color:var(--line);color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:14px;line-height:1.5;background:var(--paper-2);border:1px dashed var(--line);border-radius:10px;padding:12px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statrow div{background:var(--paper-2);border-radius:10px;padding:10px;text-align:center}
.statrow b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.statrow span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px 0}

/* tab bar */
.tabs{display:none!important;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1px solid var(--line);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:none;padding:8px 4px 9px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:#0b121b8c;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding-block:18px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out;max-height:90%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.scrim.center{align-items:center;padding:16px}
.scrim.center .sheet{border-radius:18px;padding-bottom:18px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.2;text-wrap:balance}
.sheet .sub{color:var(--muted);margin-top:4px;font-size:14px;line-height:1.4}
.sheet p{line-height:1.5}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;padding:10px 12px;min-width:0}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt svg{width:36px;height:36px}
.opt .t{font-weight:700;display:block}
.opt .r{font-size:12.5px;color:var(--muted);display:block;line-height:1.3;margin-top:1px}
.opt .p{font-family:var(--f-mono);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt .p small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.close{margin-top:10px;width:100%;border:none;background:none;color:var(--muted);font-weight:600;padding:8px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:11px 12px;font-weight:700;font-size:15px;width:100%;margin-top:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qprog{display:flex;gap:4px;margin-top:10px}
.qprog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.qprog i.ok{background:var(--good)}.qprog i.no{background:var(--bad)}.qprog i.cur{background:var(--accent)}
.qtext{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.4;margin-top:14px;text-wrap:balance}
.qopts{display:grid;gap:8px;margin-top:14px}
.qopt{border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;padding:12px 14px;text-align:left;font-weight:600}
.qopt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--paper))}
.qopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--paper))}
.catdot{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--cc);border-radius:99px;padding:2px 9px;margin-right:4px;vertical-align:1px}
.tally{margin:10px 0 2px;font-size:13px;line-height:1.4}.tally b{display:block;margin-bottom:6px}.tally span{display:inline-block;margin:0 5px 5px 0;padding:3px 9px;border-radius:99px;border:1.5px solid var(--cc);color:var(--ink,#1b2838);font-weight:600}.tally span.on{background:var(--cc);color:#fff}
.fact{margin-top:12px;font-size:14.5px;line-height:1.5;background:var(--paper-2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0}
.result{font-family:var(--f-mono);font-size:28px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.stamp{width:136px;height:136px;margin:0 auto;border:4px double var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;
  transform:rotate(-12deg);font-family:var(--f-display);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.stamp div{font-size:9.5px;letter-spacing:.18em;font-weight:700}
.stamp strong{display:block;font-size:15px;font-weight:800;line-height:1.1;margin:3px 6px}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.photo-wrap{position:relative;max-width:300px;margin:4px auto 0}
.photo-wrap .polaroid{--r:-2deg}
.photo-wrap .stamp{position:absolute;right:-14px;bottom:-20px;width:110px;height:110px;background:color-mix(in srgb,var(--paper) 70%,transparent)}
.photo-wrap .stamp strong{font-size:12px}
.camera{position:fixed;inset:0;z-index:40;background:#000;display:grid;place-items:center}
.camera canvas{width:100%;height:100%;display:block}
.camera .vf{position:absolute;inset:14%;border:2px solid #ffffffb0;border-radius:6px;pointer-events:none}
.camera .vf::before,.camera .vf::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%}
.camera .lab{position:absolute;bottom:calc(9% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em}
.camera .fl{position:absolute;inset:0;background:#fff;opacity:0}
.camera .fl.go{animation:fl .5s ease-out}
@keyframes fl{10%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px #0004;line-height:1.35}
.intro ul{padding-left:18px;margin:10px 0 0;line-height:1.55}
@media (max-width:380px){.places{grid-template-columns:1fr}.top{gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* keep clear of notches and camera islands */
:root{--top:max(18px,calc(env(safe-area-inset-top,0px) + 10px));--sl:max(10px,env(safe-area-inset-left,0px));--sr:max(10px,env(safe-area-inset-right,0px))}
.hud,.walkctl,#mapback,.rankchip,.mapctl,.walk .mapctl,.maphint{top:var(--top)}
#tab-map .maphint{top:calc(var(--top) + 46px)}
.cmap-top,.cmap-btns{top:var(--top)}
/* left-handed: controls on the left, info on the right */
body.lefty .hud{left:auto;right:var(--sr)}
body.lefty .walkctl,body.lefty .mapctl{right:auto;left:var(--sl)}
body.lefty #mapback{left:auto;right:var(--sr)}
body.lefty .maphint{left:60px;right:var(--sr)}
body.lefty .joy{right:auto;left:max(14px,env(safe-area-inset-left,0px))}
body.lefty .walkhint{left:160px;right:var(--sr)}
body.lefty .near{left:184px;right:var(--sr)}
body.lefty .cmap-btns{right:auto;left:var(--sl)}
body.lefty .cmap-top{left:64px;right:var(--sl)}
.handpick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0 4px}.handpick button{white-space:normal;min-width:0}#bag>*{min-width:0}
.handpick button{padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font:700 15px var(--f-body);color:var(--ink)}
.handpick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--paper))}
.handpick small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}

/* ---- the city as data: walkable area, blocks to draw, trees ---- */
function buildWorld(c){
  const m=cityMap(c);if(m.world)return m.world;
  const R=rng(hash(c.id+"blocks")),cs=c.id==="sto"?30:36;/* the street map is flat: buildings only exist as pop-up cut-outs at places */
  const isLand=m.bg==="water"?(x,y)=>m.land.some(p=>pip([x,y],p)):(m.isWater?(x,y)=>!m.isWater(x,y):()=>true);
  const segs=m.E.map(([u,v,b])=>[m.nodes[u],m.nodes[v],!!b]),bridges=segs.filter(s=>s[2]),doors=m.pois.map(p=>m.nodes[p.node]);
  m.pois.forEach(p=>{const k=poiKind(p,c),[w,h]=ART[k];p._kind=k;p._w=w;p._h=h;p._back=k==="ship"?-2:14});
  const inPark=(x,y)=>m.parks.some(p=>pip([x,y],p));
  const blocks=[],grid=new Map(),cols=Math.ceil(m.w/cs),rows=Math.ceil(m.h/cs);
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const x0=i*cs,y0=j*cs,cx=x0+cs/2,cy=y0+cs/2;if(R()<.07)continue;
    const bx0=x0+2+R()*4,by0=y0+2+R()*4,bx1=x0+cs-2-R()*4,by1=y0+cs-2-R()*4;
    if(![[bx0,by0],[bx1,by0],[bx0,by1],[bx1,by1],[cx,cy]].every(p=>isLand(p[0],p[1])))continue;
    if(inPark(cx,cy))continue;
    if(segs.some(s=>segDist([cx,cy],s[0],s[1])<11+cs*.55))continue;
    if(doors.some(d=>dist2(d,[cx,cy])<46))continue;
    if(false){blocks.push([bx0,by0,bx1,by1,R()]);grid.set(i+","+j,blocks.length-1)}
  }
  const inBlock=(x,y,r)=>{const i=Math.floor(x/cs),j=Math.floor(y/cs);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const k=grid.get((i+a)+","+(j+b));if(k===undefined)continue;const q=blocks[k];if(x>q[0]-r&&x<q[2]+r&&y>q[1]-r&&y<q[3]+r)return true}return false};
  const onBridge=(x,y)=>bridges.some(s=>segDist([x,y],s[0],s[1])<9);
  const behindArt=(x,y)=>m.pois.some(p=>{const d=m.nodes[p.node];return p._kind!=="park"&&Math.abs(x-d[0])<p._w*.45&&Math.abs(y-(d[1]-p._back))<3});
  const walkable=(x,y)=>x>4&&y>4&&x<m.w-4&&y<m.h-4&&(onBridge(x,y)||(isLand(x,y)&&!inBlock(x,y,2.5)));
  const trees=[],Rt=rng(hash(c.id+"trees"));
  for(const p of m.parks){const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);for(let x=Math.min(...xs);x<Math.max(...xs);x+=17)for(let y=Math.min(...ys);y<Math.max(...ys);y+=17){
    const tx=x+Rt()*10,ty=y+Rt()*10;if(pip([tx,ty],p)&&isLand(tx,ty)&&!doors.some(d=>dist2(d,[tx,ty])<32)&&!segs.some(s=>segDist([tx,ty],s[0],s[1])<12))trees.push([tx,ty,.8+Rt()*.5])}}
  const ripples=[],Rw=rng(7);for(let i=0;i<m.w*m.h/700;i++){const x=Rw()*m.w,y=Rw()*m.h;if(!isLand(x,y)&&!onBridge(x,y))ripples.push([x,y,5+Rw()*8,Rw()*6])}
  const roofs=ROOFS[c.st]||ROOFS.euro;for(const b of blocks){b.push(roofs[Math.floor(b[4]*roofs.length)]);b.push(8+b[4]*10*(c.st==="modern"?3:c.st==="asia"?2:1))}
  return m.world={cs,blocks,isLand,walkable,segs,trees,ripples};
}

  g.fillStyle=m.bg==="water"?WATER:LAND;g.fillRect(0,0,m.w,m.h);

function npcStep(n,wd,px,py,dt,want){

  const d=dist2([n.x,n.y],[px,py]);if(d>240||(!want&&d>140)){n.on=false;return}
  n.t-=dt;if(n.t<=0){const a=Math.random()*6.283,sp=Math.random()<.2?0:6+Math.random()*5;n.vx=Math.cos(a)*sp;n.vy=Math.sin(a)*sp;n.t=2+Math.random()*4}

function takePhoto(i){
  const c=here(),cam=document.createElement("div");cam.className="camera";
  cam.innerHTML=`<canvas></canvas><div class="vf"></div><div class="lab">${esc(c.s[i].toUpperCase())}</div><div class="fl"></div>`;
  document.body.appendChild(cam);drawScene(cam.querySelector("canvas"),c,hourOf());busy=true;
  setTimeout(()=>{cam.querySelector(".fl").classList.add("go");AMB.shutter()},650);
  setTimeout(()=>{cam.remove();busy=false;
    const hr=hourOf();S.film=Math.max(0,(S.film||0)-1);S.photos.push({c:c.id,s:i,h:hr,d:dayOf()});pass(1);spendEnergy(3);
    if(Math.random()<.06){const a=Math.min(S.money,r10(150+Math.random()*250));if(a>0){S.money-=a;EV.push({type:"pick",a})}}
    const isMission=S.missions.includes(c.id)&&i===c.k;
    let html=`<div class="photo-wrap"><div class="polaroid"><canvas></canvas><div class="cap">${esc(c.s[i])}<small>${esc(c.n)} · dag ${dayOf()} kl. ${clock()}</small></div></div>`;
    if(isMission){const t=tierOf(c);S.money+=t.reward;S.missions=S.missions.filter(x=>x!==c.id);S.done.push(c.id);gainXP(MISSION_XP);fillMissions();
      html+=`<div class="stamp"><div><div>UPPDRAG</div><strong>KLART</strong><div>+${MISSION_XP} XP</div></div></div></div><h2 style="margin-top:22px">Klubben är nöjd!</h2><div class="sub">Bilden skickas hem. Du får ${fmt(t.reward)} kr och ${MISSION_XP} erfarenhetspoäng.</div><div class="fact">${esc(c.f)}</div>`}
    else{html+=`</div><h2 style="margin-top:18px">Fint foto!</h2><div class="sub">${S.missions.includes(c.id)?"Det här var inte motivet klubben ville ha. Läs uppdraget igen.":"Bilden hamnar i ditt album."}</div>`}
    const m=modal(html+`<button class="btn primary" type="button" id="ok">Fortsätt</button>`,{center:true,dismiss:false});
    requestAnimationFrame(()=>drawScene(m.querySelector(".polaroid canvas"),c,hr));
    m.querySelector("#ok").onclick=closeModal;render();
  },1150);
}

  for(const lvl of [0,1])for(const cat of shuffle(cs)){for(const q of placePool(c,cat)[lvl]){if(out.length>=n)break;if(!taken.some(t=>t[0]===q[0])&&!out.some(t=>t[0]===q[0]))out.push(q)}}

function jobGen(c,gens,taken){for(let n=0;n<40;n++){const g=PICK(gens),q=g[0]==="@"?catGen(g.slice(1),c,taken):GEN[g](c);if(!seen(q)&&!taken.some(t=>t[0]===q[0])&&new Set(q.slice(1)).size===4)return q}

jobQs=function(k){const c=here(),[cats,gens]=jobTopic(k),sig=!JOB_TOPIC[k];
  const trade=shuffle((JOB_NEUTRAL[k]||[]).map(i=>JOBS[k].q[i]).filter(q=>q&&!seen(q)));
  const local=[];for(const lvl of [0,1])for(const cat of cats)for(const q of placePool(c,cat)[lvl])if(!local.some(t=>t[0]===q[0]))local.push(q);
  const out=[];const nTrade=sig?4:Math.max(2,4-Math.min(2,local.length));
  for(const q of trade){if(out.length>=nTrade)break;out.push(q)}
  for(const q of local){if(out.length>=4)break;if(!out.some(t=>t[0]===q[0]))out.push(q)}
  for(const q of trade){if(out.length>=4)break;if(!out.includes(q))out.push(q)}
  while(out.length<4)out.push(jobGen(c,gens,out));markSeen(out);return shuffle(out)};

  const dur=reduce?1:Math.min(2600,900+dist*.12),t0=performance.now();

const AMB=(()=>{

  const VOW=[[730,1090],[530,1840],[270,2290],[570,840],[300,870],[660,1720],[440,1020],[390,1990]];
  function makeVoice(){const o=ctx.createOscillator();o.type="sawtooth";const base=R()<.5?95+R()*45:170+R()*70;o.frequency.value=base;

  /* --- one-shot events --- */
  function car(){const t=ctx.currentTime,dur=2.5+R()*3,dir=R()<.5?-1:1,o=out(0,.15);o.p.pan.setValueAtTime(-.9*dir,t);o.p.pan.linearRampToValueAtTime(.9*dir,t+dur);
    const n=ctx.createBufferSource();n.buffer=NB.brown;const lp=filt("lowpass",300);lp.frequency.linearRampToValueAtTime(900,t+dur/2);lp.frequency.linearRampToValueAtTime(250,t+dur);n.connect(lp);lp.connect(o.g);
    const e=ctx.createOscillator();e.type="sawtooth";const f=55+R()*40;e.frequency.setValueAtTime(f*1.06,t);e.frequency.linearRampToValueAtTime(f*.93,t+dur);const el=filt("lowpass",280),eg=ctx.createGain();eg.gain.value=.22;chain(e,el,eg,o.g);

    for(let k=0;k<n;k++){const st=t+k*.28,len=k?.12:.12+R()*.4;for(const m of [1,1.26]){const os=ctx.createOscillator();os.type="square";os.frequency.value=f*m;const g=ctx.createGain();

  function siren(type){const t=ctx.currentTime,dur=9+R()*5,o=out(R()*1.4-.7,.8,.5),os=ctx.createOscillator();os.type="triangle";

    else for(let tt=t;tt<t+dur;tt+=1){os.frequency.setValueAtTime(440,tt);os.frequency.setValueAtTime(587,tt+.5)}
    os.detune.setValueAtTime(40,t);os.detune.linearRampToValueAtTime(-60,t+dur);const lp=filt("lowpass",1500);chain(os,lp,o.g);
    o.g.gain.setValueAtTime(0,t);o.g.gain.linearRampToValueAtTime(.09,t+dur*.5);o.g.gain.linearRampToValueAtTime(0,t+dur);o.p.pan.linearRampToValueAtTime(R()*1.4-.7,t+dur);
    os.start(t);os.stop(t+dur+.1);o.kill(dur*1000+3500)}
  function bell(){const t=ctx.currentTime,base=2100+R()*400,o=out(R()*1.6-.8,.25);o.g.gain.value=.045;
    for(const st of [t,t+.17])for(const m of [1,1.52,2.33,3.1]){const os=ctx.createOscillator();os.frequency.value=base*m;const g=ctx.createGain();g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(1/m,st+.005);g.gain.exponentialRampToValueAtTime(.0001,st+.55);chain(os,g,o.g);os.start(st);os.stop(st+.6)}

  function tick(){const t=ctx.currentTime,dur=1.2+R()*1,dir=R()<.5?-1:1,o=out(-.7*dir,.1),os=ctx.createOscillator();os.type="square";os.frequency.value=14+R()*8;const hp=filt("highpass",3500);chain(os,hp,o.g);
    o.p.pan.linearRampToValueAtTime(.7*dir,t+dur);o.g.gain.setValueAtTime(0,t);o.g.gain.linearRampToValueAtTime(.05,t+dur/2);o.g.gain.linearRampToValueAtTime(0,t+dur);os.start(t);os.stop(t+dur+.05);o.kill(dur*1000+2000)}
  function scoot(){const t=ctx.currentTime,dur=2+R()*1.5,dir=R()<.5?-1:1,f=95+R()*40,o=out(-.9*dir,.2);o.p.pan.linearRampToValueAtTime(.9*dir,t+dur);
    const os=ctx.createOscillator();os.type="sawtooth";os.frequency.setValueAtTime(f,t);os.frequency.linearRampToValueAtTime(f*1.12,t+dur*.45);os.frequency.linearRampToValueAtTime(f*.85,t+dur);
    const lfo=ctx.createOscillator();lfo.frequency.value=24;const lg=ctx.createGain();lg.gain.value=f*.04;lfo.connect(lg);lg.connect(os.frequency);
    const lp=filt("lowpass",1100);chain(os,lp,o.g);o.g.gain.setValueAtTime(0,t);o.g.gain.linearRampToValueAtTime(.09,t+dur*.45);o.g.gain.linearRampToValueAtTime(0,t+dur);

  function gull(){const t=ctx.currentTime,n=2+Math.floor(R()*3),base=1400+R()*500,o=out(R()*1.6-.8,.5,.8);
    for(let i=0;i<n;i++){const st=t+i*(.3+R()*.15),os=ctx.createOscillator();os.type="sawtooth";os.frequency.setValueAtTime(base*1.15,st);os.frequency.exponentialRampToValueAtTime(base*.7,st+.28);
      const bp=filt("bandpass",base,3),g=ctx.createGain();g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.07,st+.03);g.gain.linearRampToValueAtTime(0,st+.3);chain(os,bp,g,o.g);os.start(st);os.stop(st+.32)}

  function bird(){const t=ctx.currentTime,n=4+Math.floor(R()*6),f0=2500+R()*2000,up=R()<.5,o=out(R()*1.8-.9,.3);o.g.gain.value=1;let st=t;
    for(let i=0;i<n;i++){const len=.04+R()*.05,os=ctx.createOscillator();os.frequency.setValueAtTime(f0*(up?1:1.4),st);os.frequency.exponentialRampToValueAtTime(f0*(up?1.45:1),st+len);
      const g=ctx.createGain();g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.025,st+.01);g.gain.linearRampToValueAtTime(0,st+len);chain(os,g,o.g);os.start(st);os.stop(st+len+.01);st+=len+.05+R()*.08}

const SND_KEY="resfeber-sound";

/* ================= Handedness ================= */
const HANDK="resfeber-hand";
let HANDV=null;function getHand(){try{return localStorage.getItem(HANDK)||HANDV}catch(e){return HANDV}}
function setHand(v){HANDV=v;try{localStorage.setItem(HANDK,v)}catch(e){}document.body.classList.toggle("lefty",v==="left");document.querySelectorAll(".handpick button").forEach(b=>b.classList.toggle("on",b.dataset.hand===v))}
const handPicker=()=>{const v=getHand()||"right";return `<div class="handpick"><button type="button" data-hand="left" class="${v==="left"?"on":""}">✋ Vänster hand<small>Spaken och knapparna till vänster</small></button><button type="button" data-hand="right" class="${v!=="left"?"on":""}">Höger hand 🤚<small>Spaken och knapparna till höger</small></button></div>`};
function wireHand(m){m.querySelectorAll(".handpick button").forEach(b=>b.onclick=()=>setHand(b.dataset.hand))}
{const v=getHand();document.body.classList.toggle("lefty",v==="left")}
/* ================= Boot ================= */
function intro(saved){
  const m=modal(`<div class="intro"><h2>Välkommen till Världsresenärernas klubb</h2>
   <p style="margin:10px 0 0">Du är klubbens nyaste medlem. Målet är att bli <b>ordförande</b>. Klubben skickar uppdrag: fotografera kända platser runt om i världen, men den säger aldrig vilken stad det gäller.</p>
   <ul><li>Du börjar i Europa. När du stiger i graderna låser du upp en världsdel i taget, från Nordamerika till Oceanien.</li>
   <li>Varje stad har <b>fem arbetsplatser</b>. Där tjänar du pengar genom att svara på frågor om yrket.</li>
   <li>Sov på <b>hotell</b> för att få tillbaka energin. Var försiktig ute på natten.</li>
   <li>Du reser från riktiga stationer: flyg går från <b>flygplatsen</b>, tåg från <b>tågstationen</b> och båtar från <b>hamnen</b>. Väskan öppnar du med knappen i stadsbilden.</li>
   <li>Gå genom att trycka på kartan, hålla fingret mot den eller dra i <b>spaken</b>. Hus reser sig ur marken när du kommer nära: hotell, butik, arbetsplatser och klubbens kontor.</li>
   <li>Tryck på <b>högtalaren</b> i stadsbilden för att höra hur staden låter.</li></ul>
   <div class="sec-h" style="margin-top:12px"><span>Vilken hand spelar du med?</span></div>${handPicker()}
   <button class="btn primary" type="button" id="go">${saved?"Fortsätt resan":"Börja resan i Stockholm"}</button></div>`,{center:true,dismiss:false});
  wireHand(m);m.querySelector("#go").onclick=()=>{if(!getHand())setHand("right");closeModal()};
}
